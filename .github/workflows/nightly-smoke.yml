name: Nightly prod smoke

# Prod smoke against the real deployed civops-website (Vercel, civops.io).
# Needs no build, no secrets, no dev server — just hits https://civops.io
# directly. Pattern matches LNS-Research/cdi's nightly-smoke.yml.
on:
  schedule:
    - cron: '0 12 * * *'  # 08:00 America/New_York (12:00 UTC)
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` needed — test-smoke.mjs uses only built-in fetch, no deps.
      - name: Prod smoke (https://civops.io)
        run: node scripts/test-smoke.mjs
